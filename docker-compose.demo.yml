# =====================================================================
# 演示/公网部署 overlay（在仓库根目录与 docker-compose.yml 叠加使用）：
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# 域名与凭据写在仓库根 .env（compose 自动读取，模板见 .env.demo.example）：
#   DEMO_DOMAIN=pomelo.host            # 主站（前端 + /api + /ws + /lk + /grafana 子域）
#   DEMO_MEDIA_DOMAIN=oss.pomelo.host  # 对象存储（presigned URL 直连 MinIO）
#   GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD  # Grafana 登录凭据（必填）
#   POMELO_API_BIND / POMELO_WS_BIND=127.0.0.1   # 仅反代可达，宿主端口不对公网开放
#   POMELO_TCP_HOST_PORT=8999          # 宿主 9000 让给 caddy 的 layer4，网关挪到 8999
#
# 与基线 compose 的差异：
#   1. 新增 caddy：80/443 + 9000 反代 + Let's Encrypt 自动签发（三个域名各一张证书；
#      TCP 9000 走 layer4 TLS 终结，镜像为 pomelo/caddy-l4:2，见 deploy/demo/caddy-l4/）
#   2. gateway：POMELO_TLS_ENABLED=false（TLS 在 Caddy 边缘统一终结，网关本体明文）
#   3. livekit：换用 conf/livekit.demo.yaml（use_external_ip: true + webhook 兜底），
#      去掉 --node-ip
#   4. pomelo：经 POMELO_* 环境覆盖注入浏览器可达地址（ConfigHolder 支持，免重打镜像）
#   5. grafana：关闭匿名只读强制登录，入口 https://grafana.{$SITE_DOMAIN}
# =====================================================================
services:
  pomelo:
    environment:
      # POMELO_LIVEKIT_PUBLIC_URL → livekit.publicUrl（浏览器可达的 SFU 信令地址）
      POMELO_LIVEKIT_PUBLIC_URL: wss://${DEMO_DOMAIN}/lk
      # POMELO_MEDIA_PUBLIC_ENDPOINT → media.publicEndpoint（presigned URL 的 host）
      POMELO_MEDIA_PUBLIC_ENDPOINT: https://${DEMO_MEDIA_DOMAIN}

  livekit:
    # 同容器目标路径的挂载在后加载的文件里优先生效，此处覆盖基线的 livekit.yaml
    volumes: [./conf/livekit.demo.yaml:/etc/livekit/livekit.yaml:ro]
    # 公网部署靠 use_external_ip 自动探测公网 IP，不再用 --node-ip 宣告固定地址
    command: --config /etc/livekit/livekit.yaml

  # 网关在 demo 形态关闭自身 TLS：9000/9001 均以明文提供给 Caddy（layer4 与 /ws 反代），
  # TLS 统一在边缘终结（原生客户端因此拿到正规 ACME 证书而非自签）。容器内网明文可接受：
  # 9000/9001 宿主侧均不出 docker 网络（9001 绑 127.0.0.1；9000 宿主侧由
  # .env 的 POMELO_TCP_HOST_PORT=8999 挪开，宿主 9000 归 caddy 的 layer4 独占）
  gateway:
    environment:
      POMELO_TLS_ENABLED: "false"

  caddy:
    # 自定义镜像：官方 caddy:2 无 layer4 模块，起不来（Caddyfile 有 layer4 全局块）
    build: ./deploy/demo/caddy-l4
    image: pomelo/caddy-l4:2
    container_name: pomelo-caddy
    ports:
      - "80:80"         # HTTP→HTTPS 跳转 + ACME HTTP-01 校验（域名形态必需）
      - "443:443"
      - "443:443/udp"   # HTTP/3
      - "9000:9000"     # TCP 网关（layer4 TLS 终结 → gateway:9000，原生客户端 tcps://）
    volumes:
      - ./deploy/demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/demo/import.d:/etc/caddy/import.d:ro
      # 前端构建产物：在 pomelo-web 里 npm ci && npm run build 后同步到 ../pomelo-web/dist
      - ../pomelo-web/dist:/srv/dist:ro
      - caddy-data:/data    # ACME 证书库，务必持久化（续期与频控依赖它）
      - caddy-config:/config
    environment:
      SITE_DOMAIN: ${DEMO_DOMAIN}
      MEDIA_DOMAIN: ${DEMO_MEDIA_DOMAIN}
    depends_on:
      - pomelo
      - gateway
      - livekit
      - grafana
    restart: unless-stopped
    networks: [pomelo-net]

  # 公网形态的 Grafana：关闭匿名只读，强制登录；账号密码经仓库根 .env 注入
  # （GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD，密码缺失时 compose 直接报错拒启）。
  # 注意 GF_SECURITY_ADMIN_PASSWORD 只在 grafana-data 卷首启时生效：
  # 已初始化过的旧部署需在 UI 里改密，或 docker compose down 后删除该卷重建（看板由
  # provisioning 只读挂载，重建不丢）。
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?需在仓库根 .env 设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DEMO_DOMAIN}/

volumes:
  caddy-data:
  caddy-config:
