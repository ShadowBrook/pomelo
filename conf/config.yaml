api:
  http:
    port: 8888

gateway:
  tcp:
    port: 9000
  websocket:
    port: 9001

redis:
  uri: "redis://redis:6379"
  maxPoolSize: 64
  maxWaitingHandlers: 512
  onlineSetKey: "im:online:users"
  cm:
    endpoint: "redis://redis:6379"

database:
  host: postgres
  port: 5432
  database: pomelo_db
  user: pomelo
  password: pomelo123
  pool:
    maxSize: 64
    maxWaitQueueSize: 512
    connectionTimeout: 10000
    idleTimeout: 60

idGenerator:
  allocationSize: 5000
  redisKey: "seq:id:generator"

snowflake:
  workerId: 1

jwt:
  secret: "pomelo-dev-secret-change-in-production"
  ttlSeconds: 86400
  blacklistPrefix: "jwt:blacklist:"

nanoid:
  size: 21

bcrypt:
  cost: 12

friend:
  searchLimit: 20

message:
  pullLimit: 50
