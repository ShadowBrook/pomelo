# Prometheus 抓取配置 —— seqsvr 可观测性（docs/2026-09-17-seqsvr-optimization-plan.md）
# 目标均为 compose 网络内服务名；/metrics 已在各 admin/API 端口暴露
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: seqsvr-alloc
    static_configs:
      - targets: ['seqsvr-alloc-1:10105', 'seqsvr-alloc-2:10105']

  - job_name: seqsvr-mediate
    static_configs:
      - targets: ['seqsvr-mediate:10106']

  - job_name: gateway
    static_configs:
      - targets: ['gateway:10104']

  - job_name: logic
    # ApiVerticle 启用 TLS（自签证书），跳过校验抓取
    scheme: https
    tls_config:
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ['pomelo:8888']
