# ================================================================
# pomelo 一体化部署：主应用 + 数据库 + Redis + seqsvr 发号服务
#
# 镜像由 Jib Maven Plugin 产出（无需 Dockerfile）：
#   ./mvnw -pl pomelo-seqsvr/pomelo-seqsvr-store \
#          -pl pomelo-seqsvr/pomelo-seqsvr-server \
#          -pl pomelo-seqsvr/pomelo-seqsvr-mediate \
#          -pl pomelo-logic-server \
#          -pl pomelo-gateway \
#          -am package -DskipTests \
#   && \
#   for mod in pomelo-seqsvr/pomelo-seqsvr-store \
#              pomelo-seqsvr/pomelo-seqsvr-mediate \
#              pomelo-seqsvr/pomelo-seqsvr-server \
#              pomelo-logic-server \
#              pomelo-gateway; do \
#     ./mvnw -pl "$mod" com.google.cloud.tools:jib-maven-plugin:3.4.0:dockerBuild; \
#   done
#
# 然后：
#   docker compose up -d
# ================================================================
services:
  pomelo:
    image: pomelo/pomelo
    container_name: pomelo
    ports:
      # 开发默认放开给局域网真机联调；生产 .env 设 POMELO_API_BIND=127.0.0.1
      # （Caddy /api 走 docker 内网反代，宿主端口无需公开）
      - "${POMELO_API_BIND:-0.0.0.0}:8888:8888"
    environment:
      TZ: "Asia/Shanghai"
      # 集群 EventBus（与 gateway / seqsvr 同 Redis 集群）
      VERTX_CLUSTER: "true"
      POMELO_REDIS_CM_ENDPOINT: "redis://redis:6379"
      # 数据库配置（通过 POMELO_* 环境变量覆盖 config.yaml 默认值）
      POMELO_DATABASE_HOST: postgres
      POMELO_DATABASE_PORT: "5432"
      POMELO_DATABASE_DATABASE: pomelo_db
      POMELO_DATABASE_USER: pomelo
      POMELO_DATABASE_PASSWORD: pomelo123
      # Redis 配置
      POMELO_REDIS_URI: "redis://redis:6379"
      # TLS（HTTP API → https，证书由 deploy.sh 生成并挂载）
      POMELO_TLS_ENABLED: "true"
      POMELO_TLS_CERT_PATH: "/certs/server.crt"
      POMELO_TLS_KEY_PATH: "/certs/server.key"
      # JVM 参数
      JAVA_OPTS: "-Xms256m -Xmx512m"
    # JWT 签名密钥（HS256 密钥即签发权）与 LiveKit token 签名密钥：
    # 均由 deploy.sh 随机生成，不入库
    env_file: [./conf/jwt.env, ./conf/livekit.env]
    volumes: [./conf/tls:/certs:ro]
    depends_on:
      postgres:
        condition: service_healthy
      # 先跑完 schema 收敛（补列/建表），避免带着旧表结构启动
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pomelo-net

  gateway:
    image: pomelo/gateway
    container_name: pomelo-gateway
    ports:
      # TCP Gateway 宿主端口（容器内恒为 9000）。公网（demo overlay）形态下 caddy
      # 独占发布宿主 9000（layer4 TLS 终结 → gateway:9000），网关宿主侧经 demo .env
      # 的 POMELO_TCP_HOST_PORT=8999 挪开避免同机双绑；该绑定仅供开发/局域网联调
      # 与服务器本机排障（openssl s_client 等）使用
      - "${POMELO_TCP_BIND:-127.0.0.1}:${POMELO_TCP_HOST_PORT:-9000}:9000"
      # WebSocket Gateway：开发默认放开给局域网真机联调；生产 .env 设
      # POMELO_WS_BIND=127.0.0.1（Caddy /ws 走 docker 内网反代，宿主端口无需公开）
      - "${POMELO_WS_BIND:-0.0.0.0}:9001:9001"
    environment:
      TZ: "Asia/Shanghai"
      VERTX_CLUSTER: "true"
      POMELO_REDIS_CM_ENDPOINT: "redis://redis:6379"
      # TLS（TCP/WS 网关，客户端需使用 TLS / wss://）
      POMELO_TLS_ENABLED: "true"
      POMELO_TLS_CERT_PATH: "/certs/server.crt"
      POMELO_TLS_KEY_PATH: "/certs/server.key"
      JAVA_OPTS: "-Xms256m -Xmx512m"
    # 与 logic 侧共用同一密钥，否则网关验签不过
    env_file: [./conf/jwt.env]
    volumes: [./conf/tls:/certs:ro]
    depends_on:
      redis:
        condition: service_healthy
      pomelo:
        condition: service_started
    restart: unless-stopped
    networks:
      - pomelo-net

  postgres:
    image: postgres:latest
    container_name: pomelo-postgres
    environment:
      POSTGRES_DB: pomelo_db
      POSTGRES_USER: pomelo
      POSTGRES_PASSWORD: pomelo123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # 初始化建表脚本（仅空数据卷首启时执行一次）
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomelo -d pomelo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pomelo-net

  # ============ schema 收敛（幂等：新库建表、老卷补列） ============
  # 老数据卷不会重跑 initdb，代码升级新增的列只在 schema.sql 里，不落库就会在
  # 运行期报 42703 缺列（典型：im_call.participants → 「通话服务暂不可用」）。
  # 每次 up -d 都跑一遍；失败即非零退出，pomelo 不会带着旧表结构启动。
  db-migrate:
    image: postgres:latest
    container_name: pomelo-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/schema.sql:/schema.sql:ro
    entrypoint:
      - psql
      - postgres://pomelo:pomelo123@postgres:5432/pomelo_db
      - -v
      - ON_ERROR_STOP=1
      - -q
      - -f
      - /schema.sql
    restart: "no"
    networks:
      - pomelo-net

  redis:
    image: redis:7-alpine
    container_name: pomelo-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pomelo-net

  # ============ seqsvr 发号服务 ============

  seqsvr-store-1:
    image: pomelo/seqsvr-store
    container_name: seqsvr-store-1
    # StoreSvr 需要写 /data mmap 持久化，Docker named volume 默认 root 所有，
    # 临时以 root 运行；上行到 K8s 后改用 fsGroup 即可切回 1000:1000
    user: root
    environment: &seqsvr-env
      TZ: "Asia/Shanghai"
      VERTX_CLUSTER: "true"
      POMELO_REDIS_CM_ENDPOINT: "redis://redis:6379"
      JAVA_OPTS: "-Xms256m -Xmx512m -Dseqsvr.dataDir=/data -Dseqsvr.store.replicaId=store-1"
    volumes: [seqsvr-data-1:/data]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [pomelo-net]

  seqsvr-store-2:
    image: pomelo/seqsvr-store
    container_name: seqsvr-store-2
    user: root
    environment:
      <<: *seqsvr-env
      JAVA_OPTS: "-Xms256m -Xmx512m -Dseqsvr.dataDir=/data -Dseqsvr.store.replicaId=store-2"
    volumes: [seqsvr-data-2:/data]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [pomelo-net]

  seqsvr-store-3:
    image: pomelo/seqsvr-store
    container_name: seqsvr-store-3
    user: root
    environment:
      <<: *seqsvr-env
      JAVA_OPTS: "-Xms256m -Xmx512m -Dseqsvr.dataDir=/data -Dseqsvr.store.replicaId=store-3"
    volumes: [seqsvr-data-3:/data]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [pomelo-net]

  seqsvr-mediate:
    image: pomelo/seqsvr-mediate
    container_name: seqsvr-mediate
    ports:
      - "127.0.0.1:10106:10106"   # admin HTTP：GET /router /nodes
    environment:
      TZ: "Asia/Shanghai"
      VERTX_CLUSTER: "true"
      POMELO_REDIS_CM_ENDPOINT: "redis://redis:6379"
      JAVA_OPTS: "-Xms256m -Xmx512m -Dseqsvr.store.replicas=seqsvr.store.store-1,seqsvr.store.store-2,seqsvr.store.store-3 -Dseqsvr.store.w=2 -Dseqsvr.store.r=2"
    depends_on:
      redis: { condition: service_healthy }
      seqsvr-store-1: { condition: service_started }
    restart: unless-stopped
    networks: [pomelo-net]

  seqsvr-alloc-1:
    image: pomelo/seqsvr-alloc
    container_name: seqsvr-alloc-1
    environment:
      TZ: "Asia/Shanghai"
      VERTX_CLUSTER: "true"
      POMELO_REDIS_CM_ENDPOINT: "redis://redis:6379"
      JAVA_OPTS: "-Xms256m -Xmx512m -Dseqsvr.nodeId=alloc-1 -Dseqsvr.mediate.enabled=true -Dseqsvr.store.replicas=seqsvr.store.store-1,seqsvr.store.store-2,seqsvr.store.store-3 -Dseqsvr.store.w=2 -Dseqsvr.store.r=2"
    depends_on:
      redis: { condition: service_healthy }
      seqsvr-mediate: { condition: service_started }
    restart: unless-stopped
    networks: [pomelo-net]

  seqsvr-alloc-2:
    image: pomelo/seqsvr-alloc
    container_name: seqsvr-alloc-2
    environment:
      <<: *seqsvr-env
      JAVA_OPTS: "-Xms256m -Xmx512m -Dseqsvr.nodeId=alloc-2 -Dseqsvr.mediate.enabled=true -Dseqsvr.store.replicas=seqsvr.store.store-1,seqsvr.store.store-2,seqsvr.store.store-3 -Dseqsvr.store.w=2 -Dseqsvr.store.r=2"
    depends_on:
      redis: { condition: service_healthy }
      seqsvr-mediate: { condition: service_started }
    restart: unless-stopped
    networks: [pomelo-net]

  # ============ Silo 对象存储（MinIO 分支） ============

  silo:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    container_name: pomelo-silo
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9002:9000"   # S3 API（外部设备经反代媒体子域访问，见 deploy/demo）
      - "127.0.0.1:9003:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: pomelo-admin
      MINIO_ROOT_PASSWORD: pomelo-admin-password
    volumes:
      - silo-data:/data
    restart: unless-stopped
    networks:
      - pomelo-net

  # ============ 对象存储初始化（幂等：确保媒体 bucket 存在） ============
  # 新数据卷首启时 bucket 不存在会导致上传 PUT 404（NoSuchBucket）。
  # 复用 silo 镜像自带的 mc（minio/mc 已从 Docker Hub 下架，勿引新镜像）；
  # mc 连不上 silo 时重试等待。
  minio-init:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    container_name: pomelo-minio-init
    depends_on:
      silo:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set s http://silo:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing s/pomelo-media
    environment:
      MINIO_ROOT_USER: pomelo-admin
      MINIO_ROOT_PASSWORD: pomelo-admin-password
    restart: "no"
    networks:
      - pomelo-net

  # ============ LiveKit SFU（音视频通话媒体面） ============

  livekit:
    image: livekit/livekit-server:v1.13.6
    container_name: pomelo-livekit
    # --node-ip：向客户端宣告的 ICE 候选地址。容器内网段（172.18.x）从宿主机浏览器不可路由，
    # 本机访问宣告 127.0.0.1（媒体 UDP 段 40000-40100 已由 compose 映射到宿主机）。
    # 局域网设备访问时改成宿主机局域网 IP 并 `docker compose up -d livekit`；
    # 生产跨网部署改为 use_external_ip: true（livekit.yaml）+ 域名/TURN，去掉本参数
    command: --config /etc/livekit/livekit.yaml --node-ip 127.0.0.1
    ports:
      - "127.0.0.1:7880:7880"            # 信令 WS（对外只经反代 wss，见 deploy/demo/Caddyfile）
      - "7881:7881/tcp"                  # WebRTC TCP 回退（ICE 直连，必须公网可达）
      - "3478:3478/udp"                  # TURN/UDP
      - "30000-30100:30000-30100/udp"    # WebRTC 媒体 UDP（避开 macOS/Linux 临时端口段，见 conf/livekit.yaml）
    volumes: [./conf/livekit.yaml:/etc/livekit/livekit.yaml:ro]
    env_file: [./conf/livekit.env]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [pomelo-net]

  # ============ Prometheus（seqsvr / 业务指标抓取与告警） ============

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pomelo-prometheus
    environment:
      # 注意：prom/prometheus 镜像无 tzdata，Web UI 图表恒为 UTC（Go 标准库不解析
      # POSIX TZ 串；zoneinfo 挂载经 virtiofs 亦不生效）。数据/告警内部全为 epoch 不受影响。
      # 要本地时间看曲线 → Grafana（按浏览器时区渲染）。
      TZ: "Asia/Shanghai"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [pomelo-net]

  # ============ Grafana（指标可视化，按浏览器时区渲染） ============

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pomelo-grafana
    environment:
      TZ: "Asia/Shanghai"
      # 开发环境：匿名只读免登录看板；编辑用 admin 账号。
      # 生产（demo overlay）会关闭匿名，密码经仓库根 .env 的 GRAFANA_ADMIN_PASSWORD 注入
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-pomelo123}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }
    restart: unless-stopped
    networks: [pomelo-net]

volumes:
  pgdata:
  seqsvr-data-1:
  seqsvr-data-2:
  seqsvr-data-3:
  silo-data:
  prometheus-data:
  grafana-data:

networks:
  pomelo-net:
    driver: bridge
