<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomelo C2C 单聊测试</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; }
h2 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.status.online { background: #4ec94e; box-shadow: 0 0 6px #4ec94e; }
.status.offline { background: #e74c3c; box-shadow: 0 0 6px #e74c3c; }
.panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; min-width: 0; }
.panel:last-child { border-right: none; }
.header { padding: 12px 16px; background: #16213e; border-bottom: 1px solid #333; }
.controls { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.controls input { flex: 1; min-width: 100px; padding: 6px 10px; background: #0f3460; border: 1px solid #444; border-radius: 4px; color: #eee; font-size: 13px; }
.controls input:focus { outline: none; border-color: #e94560; }
.btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; transition: opacity 0.2s; }
.btn-primary { background: #e94560; color: white; }
.btn-success { background: #0f3460; color: #eee; }
.btn-warn { background: #533483; color: #eee; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.msgs { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 13px; word-break: break-word; line-height: 1.4; }
.msg.sent { align-self: flex-end; background: #e94560; color: white; border-bottom-right-radius: 2px; }
.msg.received { align-self: flex-start; background: #16213e; border: 1px solid #333; border-bottom-left-radius: 2px; }
.msg .meta { font-size: 10px; opacity: 0.6; margin-top: 3px; }
.msg.image img { max-width: 200px; border-radius: 4px; margin-top: 4px; }
.input-row { display: flex; gap: 8px; padding: 10px 16px; background: #16213e; border-top: 1px solid #333; }
.input-row input { flex: 1; padding: 8px 12px; background: #1a1a2e; border: 1px solid #444; border-radius: 4px; color: #eee; font-size: 13px; }
.input-row input:focus { outline: none; border-color: #e94560; }
</style>
</head>
<body>

<!-- Alice Panel -->
<div class="panel">
  <div class="header">
    <h2><span class="status offline" id="alice-status"></span> Alice (alice)</h2>
    <div class="controls">
      <input id="alice-url" value="ws://localhost:9001" placeholder="WS URL">
      <button class="btn btn-primary" onclick="aliceConnect()">连接</button>
      <button class="btn btn-warn" onclick="aliceDisconnect()">断开</button>
    </div>
  </div>
  <div class="msgs" id="alice-msgs"></div>
  <div class="input-row">
    <input id="alice-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')aliceSend()">
    <button class="btn btn-primary" onclick="aliceSend()">发送给 Bob</button>
  </div>
</div>

<!-- Bob Panel -->
<div class="panel">
  <div class="header">
    <h2><span class="status offline" id="bob-status"></span> Bob (bob)</h2>
    <div class="controls">
      <input id="bob-url" value="ws://localhost:9001" placeholder="WS URL">
      <button class="btn btn-primary" onclick="bobConnect()">连接</button>
      <button class="btn btn-warn" onclick="bobDisconnect()">断开</button>
    </div>
  </div>
  <div class="msgs" id="bob-msgs"></div>
  <div class="input-row">
    <input id="bob-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')bobSend()">
    <button class="btn btn-primary" onclick="bobSend()">发送给 Alice</button>
  </div>
</div>

<script src="im-sdk.js"></script>
<script>
// ---- Alice Client ----
let alice = null;
function aliceConnect() {
  if (alice?.connected) return;
  const url = document.getElementById('alice-url').value;
  alice = new ImClient({ url, userId: 'alice', token: 'test-token', platform: 'web' });
  alice.on('connect', () => {
    document.getElementById('alice-status').className = 'status online';
    logMsg('alice', 'system', '已连接');
  });
  alice.on('disconnect', (e) => {
    document.getElementById('alice-status').className = 'status offline';
    logMsg('alice', 'system', '已断开');
  });
  alice.on('message', (msg) => {
    logMsg('alice', 'received', msg.content || '[非文本]', msg.msgType);
  });
  alice.on('error', (e) => logMsg('alice', 'system', '错误: ' + e));
  alice.connect().catch(e => logMsg('alice', 'system', '连接失败: ' + e));
}
function aliceDisconnect() { alice?.disconnect(); alice = null; }
function aliceSend() {
  const inp = document.getElementById('alice-input');
  const text = inp.value.trim();
  if (!text) return;
  if (!alice?.connected) { logMsg('alice', 'system', '未连接'); return; }
  alice.sendText('bob', text);
  logMsg('alice', 'sent', text);
  inp.value = '';
}

// ---- Bob Client ----
let bob = null;
function bobConnect() {
  if (bob?.connected) return;
  const url = document.getElementById('bob-url').value;
  bob = new ImClient({ url, userId: 'bob', token: 'test-token', platform: 'web' });
  bob.on('connect', () => {
    document.getElementById('bob-status').className = 'status online';
    logMsg('bob', 'system', '已连接');
  });
  bob.on('disconnect', (e) => {
    document.getElementById('bob-status').className = 'status offline';
    logMsg('bob', 'system', '已断开');
  });
  bob.on('message', (msg) => {
    logMsg('bob', 'received', msg.content || '[非文本]', msg.msgType);
  });
  bob.on('error', (e) => logMsg('bob', 'system', '错误: ' + e));
  bob.connect().catch(e => logMsg('bob', 'system', '连接失败: ' + e));
}
function bobDisconnect() { bob?.disconnect(); bob = null; }
function bobSend() {
  const inp = document.getElementById('bob-input');
  const text = inp.value.trim();
  if (!text) return;
  if (!bob?.connected) { logMsg('bob', 'system', '未连接'); return; }
  bob.sendText('alice', text);
  logMsg('bob', 'sent', text);
  inp.value = '';
}

// ---- Message Log ----
function logMsg(user, type, text, msgType) {
  const container = document.getElementById(user + '-msgs');
  const div = document.createElement('div');
  div.className = 'msg ' + (type === 'sent' ? 'sent' : (type === 'received' ? 'received' : ''));
  if (type === 'system') div.style.cssText = 'align-self:center;background:transparent;font-size:11px;opacity:0.5;border:none;';

  let content = text;
  const typeNames = {1:'📝', 2:'🖼️', 3:'🎤', 4:'🎬', 5:'📁', 6:'😀', 7:'🔔'};
  const typeLabel = msgType ? typeNames[msgType] || '' : '';

  // Auto-linkify URLs
  const urlRe = /(https?:\/\/[^\s<]+)/g;
  content = content.replace(urlRe, (url) => {
    if (/\.(png|jpg|jpeg|gif|webp|svg)(\?.*)?$/i.test(url)) {
      return `<br><img src="${url}" style="max-width:200px;border-radius:4px;margin-top:4px" onerror="this.style.display='none'"><br><a href="${url}" target="_blank" style="color:#88ccff">${url}</a>`;
    }
    return `<a href="${url}" target="_blank" style="color:#88ccff">${url}</a>`;
  });

  div.innerHTML = typeLabel + ' ' + content + '<div class="meta">' + new Date().toLocaleTimeString() + '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}
</script>
</body>
</html>
