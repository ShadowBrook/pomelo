<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomelo IM 测试</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
/* header */
.header { padding: 10px 16px; background: #16213e; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
.header .title { font-size: 15px; font-weight: 600; white-space: nowrap; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.status-dot.online { background: #4ec94e; box-shadow: 0 0 6px #4ec94e; }
.status-dot.offline { background: #e74c3c; }
.header input { padding: 4px 8px; background: #0f3460; border: 1px solid #444; border-radius: 4px; color: #eee; font-size: 12px; width: 90px; }
.header input:focus { outline: none; border-color: #e94560; }
.header .sep { color: #555; }
.header .recipient-row { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.header .recipient-row input { width: 80px; }
.btn { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.btn-primary { background: #e94560; color: white; }
.btn-warn { background: #533483; color: #eee; }
.btn:hover { opacity: 0.85; }
/* messages */
.msgs { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13px; word-break: break-word; line-height: 1.4; }
.msg.sent { align-self: flex-end; background: #e94560; color: white; border-bottom-right-radius: 2px; }
.msg.received { align-self: flex-start; background: #16213e; border: 1px solid #333; border-bottom-left-radius: 2px; }
.msg.system { align-self: center; background: transparent; font-size: 11px; opacity: 0.5; border: none; }
.msg .meta { font-size: 10px; opacity: 0.6; margin-top: 3px; display: flex; justify-content: space-between; }
/* input */
.input-row { display: flex; gap: 8px; padding: 10px 16px; background: #16213e; border-top: 1px solid #333; flex-shrink: 0; }
.input-row input { flex: 1; padding: 8px 12px; background: #1a1a2e; border: 1px solid #444; border-radius: 4px; color: #eee; font-size: 13px; }
.input-row input:focus { outline: none; border-color: #e94560; }
</style>
</head>
<body>

<div class="header">
  <span class="title">Pomelo IM</span>
  <span class="status-dot offline" id="status-dot"></span>
  <input id="user-id" placeholder="用户ID" value="alice">
  <input id="nickname" placeholder="昵称" value="Alice">
  <button class="btn btn-primary" id="btn-connect" onclick="toggleConnect()">连接</button>
  <span class="sep">|</span>
  <span class="recipient-row">发给: <input id="recipient-id" placeholder="对方ID" value="bob"></span>
</div>

<div class="msgs" id="msgs"></div>

<div class="input-row">
  <input id="msg-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send()">
  <button class="btn btn-primary" onclick="send()">发送</button>
</div>

<script src="im-sdk.js"></script>
<script>
const STATUS_ICONS = { pending: '🕐', sending: '🔄', sent: '✓', delivered: '✓✓', seen: '✓✓', failed: '❌' };
const STATUS_COLORS = { pending: '#888', sending: '#aaa', sent: '#aaa', delivered: '#aaa', seen: '#4ec94e', failed: '#e74c3c' };

let sdk = null;

function $id(id) { return document.getElementById(id); }

function logMsg(type, text, msgType) {
  const div = document.createElement('div');
  div.className = 'msg ' + (type === 'sent' ? 'sent' : type === 'received' ? 'received' : 'system');
  if (type === 'system') div.className = 'msg system';

  const typeNames = {1:'📝', 2:'🖼️', 3:'🎤', 4:'🎬', 5:'📁', 6:'😀', 7:'🔔'};
  const typeLabel = msgType ? typeNames[msgType] || '' : '';
  let content = text.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color:#88ccff">$1</a>');

  div.innerHTML =
    '<div>' + typeLabel + ' ' + content + '</div>' +
    '<div class="meta">' +
      '<span>' + new Date().toLocaleTimeString() + '</span>' +
      (type === 'sent' ? '<span class="status-icon">' + STATUS_ICONS.pending + '</span>' : '') +
    '</div>';
  const container = $id('msgs');
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function updateStatus(div, status) {
  const icon = div.querySelector('.status-icon');
  if (!icon) return;
  icon.textContent = STATUS_ICONS[status] || '';
  icon.style.color = STATUS_COLORS[status] || '#aaa';
}

async function toggleConnect() {
  if (sdk?.connected) {
    sdk.disconnect();
    sdk = null;
    $id('status-dot').className = 'status-dot offline';
    $id('btn-connect').textContent = '连接';
    logMsg('system', '已断开');
    return;
  }
  const userId = $id('user-id').value.trim();
  const nickname = $id('nickname').value.trim();
  if (!userId) { logMsg('system', '请输入用户ID'); return; }

  sdk = new ImSDK({ url: 'ws://localhost:9001' });

  sdk.on('connect', () => {
    $id('status-dot').className = 'status-dot online';
    $id('btn-connect').textContent = '断开';
    logMsg('system', nickname + ' (' + userId + ') 已上线');
  });
  sdk.on('disconnect', () => {
    $id('status-dot').className = 'status-dot offline';
    $id('btn-connect').textContent = '连接';
    logMsg('system', '已离线');
  });
  sdk.on('message', (msg) => {
    const sender = msg.senderId || 'unknown';
    logMsg('received', '[' + sender + '] ' + (msg.content || JSON.stringify(msg)), msg.msgType);
  });
  sdk.on('statusChange', (msg) => {
    // update the sent message's status icon
  });
  sdk.on('error', (e) => logMsg('system', '错误: ' + e));

  try {
    await sdk.connect({ userId });
  } catch (e) {
    logMsg('system', '连接失败: ' + e);
    sdk = null;
  }
}

function send() {
  const inp = $id('msg-input');
  const text = inp.value.trim();
  if (!text) return;
  if (!sdk?.connected) { logMsg('system', '未连接'); return; }
  const recipientId = $id('recipient-id').value.trim();
  if (!recipientId) { logMsg('system', '请输入对方ID'); return; }

  try {
    const msgId = sdk.sendMessage({ recipientId, msgType: 1, content: text });
    const div = logMsg('sent', text, 1);
    div.setAttribute('data-msgid', msgId);
    // track status changes for this message
    const fn = (m) => { if (m.id === msgId) { updateStatus(div, m.status); if (m.status === 'failed' || m.status === 'seen' || m.status === 'delivered') sdk.onStatusChange(() => {}); } };
    sdk.onStatusChange(fn);
  } catch (e) {
    logMsg('system', '发送失败: ' + e);
  }
  inp.value = '';
  inp.focus();
}
</script>
</body>
</html>
