syntax = "proto3";

package im.ctrl;

option java_package = "com.github.moxib.pomelo.proto.ctrl";
option java_outer_classname = "CtrlProto";

// ============================================================================
// 控制类型枚举
// ============================================================================
enum CtrlType {
    CTRL_TYPE_UNKNOWN      = 0;
    CTRL_TYPE_KICK_OFFLINE = 1;  // 踢下线
    CTRL_TYPE_FORCE_LOGOUT = 2;  // 强制登出
    CTRL_TYPE_NOTIFY       = 3;  // 通知
    CTRL_TYPE_SYNC         = 4;  // 同步
}

// ============================================================================
// 控制命令相关消息体
// ============================================================================
message CtrlReq {
    CtrlType ctrl_type     = 1;
    string target_user     = 2;  // 目标用户
    optional bytes payload = 3;  // 控制载荷
}

message CtrlResp {
    int32 code     = 1;  // 响应码
    string message = 2;  // 响应消息
    bytes payload  = 3;  // 控制载荷响应
}

message CtrlNotify {
    CtrlType ctrl_type = 1;
    string reason      = 2;  // 推送原因
    bytes payload      = 3;  // 控制载荷
}
