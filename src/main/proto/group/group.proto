syntax = "proto3";

package im.group;

option java_package = "com.github.moxib.pomelo.proto.group";
option java_outer_classname = "GroupProto";

import "common/common.proto";

// ============================================================================
// 群聊相关消息体
// ============================================================================
message C2GReq {
    string sender_id                 = 1;  // 发送者用户 ID
    string group_id                  = 2;  // 接受群 ID
    im.common.MessageContent message = 3;  // 消息内容
}

message C2GResp {
    int32 code         = 1;  // 响应码
    string message     = 2;  // 响应消息
    uint32 message_id  = 3;  // 消息 ID
    string group_id    = 4;  // 群 ID
    int64 server_time  = 5;  // 服务器时间
    optional int64 seq = 6;  // 序列号
}

message C2GNotify {
    string sender_id                 = 1;  // 发送者用户 ID
    string group_id                  = 2;  // 接受群 ID
    im.common.MessageContent message = 3;  // 推送的消息内容
    optional int64 seq               = 5;  // 序列号
}
