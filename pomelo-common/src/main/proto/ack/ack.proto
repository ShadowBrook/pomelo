syntax = "proto3";

package im.ack;

option java_package = "com.github.moxib.pomelo.proto.ack";
option java_outer_classname = "AckProto";

import "common/common.proto";

// ============================================================================
// ACK 消息确认
// ============================================================================

message AckReq {
  repeated int64 message_ids = 1;  // 消息 ID 列表 (snowflake 64-bit)
  common.AckType ack_type    = 2;  // ACK 类型：0=已收到，1=已读
}

message AckResp {
  common.AckType ack_type = 1;  // ACK 类型：0=已收到，1=已读
}

message AckNotify {
  repeated int64 message_ids = 1;  // 已确认的消息 ID 列表 (snowflake 64-bit)
  common.AckType ack_type    = 2;  // ACK 类型：0=已收到，1=已读
}
