syntax = "proto3";

package im.heartbeat;

option java_package = "com.github.moxib.pomelo.proto.heartbeat";
option java_outer_classname = "HeartbeatProto";

// ============================================================================
// 心跳相关消息体
// ============================================================================
message Ping {
    int64 client_time = 1;  // 客户端时间戳
}

message Pong {
    int64 server_time = 1;  // 服务器时间戳
    int64 client_time = 2;  // 回显客户端时间
}

