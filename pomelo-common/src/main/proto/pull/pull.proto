syntax = "proto3";

package im.pull;

option java_package = "com.github.moxib.pomelo.proto.pull";
option java_outer_classname = "PullProto";

import "common/common.proto";

// ============================================================================
// 消息拉取相关消息体
// ============================================================================
message PullReq {
    int32 limit = 1;  // 拉取数量限制
    int64 seq   = 2;  // 游标：离线拉取时 = sinceSeq，会话历史拉取时 = beforeTime
}

message PullResp {
    int32 code                 = 1;  // 响应码
    string message             = 2;  // 响应消息
    repeated im.common.MessageContent messages = 3;  // 消息列表
    bool has_more              = 4;  // 是否还有更多
}

// ============================================================================
// 群消息拉取（请求字段与 PullReq 不同，响应复用 PullResp）
// ============================================================================
message PullGroupMsgReq {
    int64 group_id    = 1;  // 群 ID (Snowflake)
    int64 cursor      = 2;  // 游标（seq 或时间戳，取决于 is_backward）
    int32 limit       = 3;  // 拉取数量限制
    bool is_backward  = 4;  // true=拉更早的历史，false=拉增量
}
