syntax = "proto3";

package im.pull;

option java_package = "com.github.moxib.pomelo.proto.pull";
option java_outer_classname = "PullProto";

import "common/common.proto";

// ============================================================================
// 消息拉取相关消息体
// ============================================================================
message PullReq {
    int32 limit       = 1;  // 拉取数量限制
    int64 last_msg_id = 2;  // 最后一条消息 ID
}

message PullResp {
    int32 code                 = 1;  // 响应码
    string message             = 2;  // 响应消息
    repeated im.common.MessageContent messages = 3;  // 消息列表
    bool has_more              = 4;  // 是否还有更多
}
