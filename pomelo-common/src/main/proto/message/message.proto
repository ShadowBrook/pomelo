syntax = "proto3";

package im.message;

option java_package = "com.github.moxib.pomelo.proto.message";
option java_outer_classname = "MessageProto";

import "common/common.proto";
import "auth/auth.proto";
import "chat/chat.proto";
import "group/group.proto";
import "pull/pull.proto";
import "ctrl/ctrl.proto";
import "ack/ack.proto";
import "heartbeat/heartbeat.proto";
import "upload/upload.proto";

// ============================================================================
// 统一的协议包定义 - 使用 oneof 管理所有 cmd 类型的消息体
// ============================================================================
message MsgBody {
    im.common.Cmd cmd = 1;

    oneof body {
        // 认证相关
        im.auth.AuthReq auth_req       = 10;
        im.auth.AuthResp auth_resp     = 11;
        im.auth.LogoutReq logout_req   = 12;
        im.auth.LogoutResp logout_resp = 13;

        // 单聊相关
        im.chat.C2CReq c2c_req   = 20;
        im.chat.C2CResp c2c_resp = 21;
        im.chat.C2CNotify c2c_notify  = 22;

        // 群聊相关
        im.group.C2GReq c2g_req       = 30;
        im.group.C2GResp c2g_resp     = 31;
        im.group.C2GNotify c2g_notify = 32;

        // 消息拉取
        im.pull.PullReq pull_req   = 40;
        im.pull.PullResp pull_resp = 41;

        // 控制命令
        im.ctrl.CtrlReq ctrl_req   = 50;
        im.ctrl.CtrlResp ctrl_resp = 51;
        im.ctrl.CtrlNotify ctrl_push = 52;

        // 心跳
        im.heartbeat.Ping ping      = 60;
        im.heartbeat.Pong pong      = 61;

        // ack确认消息
        im.ack.AckReq ack_req       = 62;
        im.ack.AckResp ack_resp     = 63;
        im.ack.AckNotify ack_notify = 64;

        // 媒体上传
        im.upload.UploadReq upload_req   = 70;
        im.upload.UploadResp upload_resp = 71;
    }
}
