syntax = "proto3";

package im.auth;

option java_package = "com.github.moxib.pomelo.proto.auth";
option java_outer_classname = "AuthProto";

// ============================================================================
// 认证相关消息体
// ============================================================================
message AuthReq {
    string token       = 1;  // 认证令牌
    string device_id   = 2;  // 设备 ID
    string platform    = 3;  // 平台类型 (ios/android/web)
    string app_version = 4;  // 应用版本
}

message AuthResp {
    int32 code          = 1;  // 响应码 0=成功
    string message      = 2;  // 响应消息
    string user_id      = 3;  // 用户 ID
    int64 expire_at     = 4;  // 过期时间
}

// ============================================================================
// 登出相关消息体
// ============================================================================
message LogoutReq {
    string reason = 1;  // 登出原因
}

message LogoutResp {
    int32 code     = 1;  // 响应码
    string message = 2;  // 响应消息
}
