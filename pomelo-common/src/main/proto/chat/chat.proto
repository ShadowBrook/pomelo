syntax = "proto3";

package im.chat;

option java_package = "com.github.moxib.pomelo.proto.chat";
option java_outer_classname = "ChatProto";

import "common/common.proto";

// ============================================================================
// 单聊相关消息体
// ============================================================================
message C2CReq {
    // 发送者用户 ID (Snowflake)
    int64 sender_id                  = 1;
    // 接收者用户 ID (Snowflake)
    int64 recipient_id               = 2;
    int64 message_id                 = 3;
    // 消息内容
    im.common.MessageContent message = 4;
}

message C2CResp {
    // 响应码
    int32 code         = 1;
    // 响应消息
    string message     = 2;
    // 消息 ID (snowflake 64-bit)
    int64 message_id   = 3;
    // 服务器时间
    int64 server_time  = 4;
    // 序列号
    optional int64 seq = 5;
}

message C2CNotify {
    // 发送者用户 ID (Snowflake)
    int64 sender_id                  = 1;
    // 接收者用户 ID (Snowflake)
    int64 recipient_id               = 2;
    // 推送的消息内容
    im.common.MessageContent message = 3;
    // 序列号
    optional int64 seq               = 4;
    // 消息 ID (客户端用此 ID 发送 ACK)
    optional int64 message_id        = 5;
    // 客户端消息 ID (多端回推时与本地乐观气泡按此合并去重)
    optional int64 client_msg_id     = 6;
}
