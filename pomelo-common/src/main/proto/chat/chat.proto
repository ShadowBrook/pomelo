syntax = "proto3";

package im.chat;

option java_package = "com.github.moxib.pomelo.proto.chat";
option java_outer_classname = "ChatProto";

import "common/common.proto";

// ============================================================================
// 单聊相关消息体
// ============================================================================
message C2CReq {
    string sender_id                 = 1;  // 发送者用户 ID
    string recipient_id              = 2;  // 接收者用户 ID
    int64 message_id                 = 3;
    im.common.MessageContent message = 4;  // 消息内容
}

message C2CResp {
    int32 code         = 1;  // 响应码
    string message     = 2;  // 响应消息
    int64 message_id   = 3;  // 消息 ID (snowflake 64-bit)
    int64 server_time  = 4;  // 服务器时间
    optional int64 seq = 5;  // 序列号
}

message C2CNotify {
    string sender_id                 = 1;  // 发送者用户 ID
    string recipient_id              = 2;  // 接收者用户 ID
    im.common.MessageContent message = 3;  // 推送的消息内容
    optional int64 seq               = 4;  // 序列号
    optional int64 message_id        = 5;  // 消息 ID (客户端用此 ID 发送 ACK)
}
